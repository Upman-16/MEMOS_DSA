name: Update LeetCode Dashboard

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch LeetCode data
        env:
          LEETCODE_USERNAME: Danger_exe_fr
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          username = "Danger_exe_fr"

          query = """
          query userData($username: String!, $year: Int) {
            matchedUser(username: $username) {
              username

              submitStats: submitStatsGlobal {
                acSubmissionNum {
                  difficulty
                  count
                }
              }

              userCalendar(year: $year) {
                totalActiveDays
                submissionCalendar
              }
            }

            recentAcSubmissionList(username: $username, limit: 10) {
              id
              title
              titleSlug
              timestamp
            }
          }
          """

          current_year = datetime.now(
              ZoneInfo("Asia/Kolkata")
          ).year

          payload = json.dumps({
              "query": query,
              "variables": {
                  "username": username,
                  "year": current_year
              }
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://leetcode.com/graphql",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "Mozilla/5.0",
                  "Referer": "https://leetcode.com/"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          if "errors" in data:
              raise RuntimeError(
                  json.dumps(
                      data["errors"],
                      indent=2
                  )
              )

          user = data["data"]["matchedUser"]

          if not user:
              raise RuntimeError(
                  "LeetCode user not found."
              )

          # -------------------------------------------------
          # SOLVED COUNTS
          # -------------------------------------------------

          stats = user["submitStats"]["acSubmissionNum"]

          easy = 0
          medium = 0
          hard = 0

          for item in stats:
              difficulty = item["difficulty"]
              count = int(item["count"])

              if difficulty == "Easy":
                  easy = count

              elif difficulty == "Medium":
                  medium = count

              elif difficulty == "Hard":
                  hard = count

          total = easy + medium + hard

          # -------------------------------------------------
          # SUBMISSION CALENDAR
          # -------------------------------------------------

          calendar = user["userCalendar"]

          active_days = int(
              calendar["totalActiveDays"]
          )

          submission_calendar = json.loads(
              calendar["submissionCalendar"]
          )

          india = ZoneInfo("Asia/Kolkata")

          daily_activity = []

          for timestamp, count in submission_calendar.items():

              local_date = datetime.fromtimestamp(
                  int(timestamp),
                  tz=timezone.utc
              ).astimezone(india).date()

              daily_activity.append({
                  "date": local_date,
                  "count": int(count)
              })

          daily_activity.sort(
              key=lambda x: x["date"]
          )

          # -------------------------------------------------
          # ACTIVE DATES
          # -------------------------------------------------

          active_dates = sorted(
              {
                  item["date"]
                  for item in daily_activity
                  if item["count"] > 0
              }
          )

          # -------------------------------------------------
          # CURRENT STREAK
          # -------------------------------------------------

          current_streak = 0

          if active_dates:

              current_streak = 1

              for i in range(
                  len(active_dates) - 1,
                  0,
                  -1
              ):

                  difference = (
                      active_dates[i]
                      - active_dates[i - 1]
                  ).days

                  if difference == 1:
                      current_streak += 1
                  else:
                      break

          # -------------------------------------------------
          # BEST STREAK
          # -------------------------------------------------

          best_streak = 0
          running_streak = 0
          previous_date = None

          for date in active_dates:

              if (
                  previous_date is not None
                  and (date - previous_date).days == 1
              ):
                  running_streak += 1
              else:
                  running_streak = 1

              best_streak = max(
                  best_streak,
                  running_streak
              )

              previous_date = date

          # -------------------------------------------------
          # RECENT ACTIVITY
          # -------------------------------------------------

          recent_activity = sorted(
              [
                  {
                      "date": item["date"].strftime(
                          "%Y-%m-%d"
                      ),
                      "count": item["count"]
                  }
                  for item in daily_activity
              ],
              key=lambda x: x["date"],
              reverse=True
          )[:10]

          # -------------------------------------------------
          # RECENT ACCEPTED SUBMISSIONS
          # -------------------------------------------------

          recent_submissions = (
              data["data"].get(
                  "recentAcSubmissionList"
              ) or []
          )

          # -------------------------------------------------
          # OUTPUT DATA
          # -------------------------------------------------

          output = {
              "username": username,
              "total": total,
              "easy": easy,
              "medium": medium,
              "hard": hard,
              "current_streak": current_streak,
              "best_streak": best_streak,
              "active_days": active_days,
              "recent_activity": recent_activity,
              "recent_submissions": recent_submissions,
              "updated": datetime.now(
                  timezone.utc
              ).strftime("%Y-%m-%d %H:%M UTC")
          }

          with open(
              "leetcode-data.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  indent=2
              )

          print(
              json.dumps(
                  output,
                  indent=2
              )
          )

          PY

      - name: Update README
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("leetcode-data.json").read_text(
                  encoding="utf-8"
              )
          )

          total = data["total"]
          easy = data["easy"]
          medium = data["medium"]
          hard = data["hard"]
          current_streak = data["current_streak"]
          best_streak = data["best_streak"]
          active_days = data["active_days"]
          updated = data["updated"]

          # -------------------------------------------------
          # PROGRESS BAR
          # -------------------------------------------------

          def bar(value, maximum=20):

              if total == 0:
                  return "░" * maximum

              filled = round(
                  (value / total) * maximum
              )

              filled = max(
                  0,
                  min(
                      filled,
                      maximum
                  )
              )

              return (
                  "█" * filled
                  + "░" * (
                      maximum - filled
                  )
              )

          # -------------------------------------------------
          # ACTIVITY TABLE
          # -------------------------------------------------

          activity_lines = []

          for item in data["recent_activity"]:

              blocks = "█" * min(
                  item["count"],
                  10
              )

              activity_lines.append(
                  f"| {item['date']} | "
                  f"{item['count']} | "
                  f"{blocks} |"
              )

          if not activity_lines:

              activity_lines.append(
                  "| No activity yet | 0 | |"
              )

          # -------------------------------------------------
          # RECENT ACCEPTED PROBLEMS
          # -------------------------------------------------

          submission_lines = []

          for item in data["recent_submissions"]:

              title = item["title"]
              slug = item["titleSlug"]

              submission_lines.append(
                  f"- 🧩 [{title}]"
                  f"(https://leetcode.com/problems/{slug}/)"
              )

          if not submission_lines:

              submission_lines.append(
                  "- No recent accepted submissions found."
              )

          # -------------------------------------------------
          # DASHBOARD
          # -------------------------------------------------

          dashboard = f"""<!-- LEETCODE-DASHBOARD:START -->

          ## 🏆 Live LeetCode Dashboard

          > 🔄 **Automatically synced from LeetCode**

          | 📊 Metric | 🔥 Progress |
          | :--- | ---: |
          | **Total Solved** | **{total}** |
          | 🟢 Easy | **{easy}** |
          | 🟡 Medium | **{medium}** |
          | 🔴 Hard | **{hard}** |
          | 🔥 Current Streak | **{current_streak} days** |
          | 🏆 Best Streak | **{best_streak} days** |
          | 📅 Active Days | **{active_days}** |

          ### 📈 Difficulty Distribution

          ```text
          🟢 Easy      {bar(easy)}  {easy}
          🟡 Medium    {bar(medium)}  {medium}
          🔴 Hard      {bar(hard)}  {hard}

                       TOTAL → {total}
          ```

          ### 📅 Recent Coding Activity

          | Date | Problems | Activity |
          | :--- | ---: | :--- |
          {chr(10).join(activity_lines)}

          ### 🧩 Latest Accepted Problems

          {chr(10).join(submission_lines)}

          ### 🔥 Consistency

          ```text
          Current Streak : {current_streak} days
          Best Streak    : {best_streak} days
          Active Days    : {active_days}
          ```

          > 🕐 Last synchronized: **{updated}**

          <!-- LEETCODE-DASHBOARD:END -->"""

          # -------------------------------------------------
          # UPDATE README
          # -------------------------------------------------

          path = Path("README.md")

          text = path.read_text(
              encoding="utf-8"
          )

          start = (
              "<!-- LEETCODE-DASHBOARD:START -->"
          )

          end = (
              "<!-- LEETCODE-DASHBOARD:END -->"
          )

          if start in text and end in text:

              before = text.split(
                  start,
                  1
              )[0]

              after = text.split(
                  end,
                  1
              )[1]

              text = (
                  before
                  + dashboard
                  + after
              )

          elif (
              "<!-- LEETCODE-STATS:START -->"
              in text
          ):

              old_start = (
                  "<!-- LEETCODE-STATS:START -->"
              )

              old_end = (
                  "<!-- LEETCODE-STATS:END -->"
              )

              before = text.split(
                  old_start,
                  1
              )[0]

              after = text.split(
                  old_end,
                  1
              )[1]

              text = (
                  before
                  + dashboard
                  + after
              )

          else:

              text = (
                  dashboard
                  + "\n\n"
                  + text
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "README dashboard updated successfully."
          )

          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes detected."
          else
            git commit -m "Update LeetCode dashboard"
            git push
          fi
