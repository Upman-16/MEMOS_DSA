name: Update LeetCode Dashboard

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch LeetCode data
        env:
          LEETCODE_USERNAME: Danger_exe_fr
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from zoneinfo import ZoneInfo

          USERNAME = "Danger_exe_fr"
          INDIA = ZoneInfo("Asia/Kolkata")

          QUERY = """
          query userData($username: String!, $year: Int) {
            matchedUser(username: $username) {

              submitStats: submitStatsGlobal {
                acSubmissionNum {
                  difficulty
                  count
                }
              }

              userCalendar(year: $year) {
                totalActiveDays
                submissionCalendar
              }
            }

            recentAcSubmissionList(
              username: $username
              limit: 10
            ) {
              id
              title
              titleSlug
              timestamp
            }
          }
          """

          now = datetime.now(INDIA)
          current_year = now.year

          payload = json.dumps({
              "query": QUERY,
              "variables": {
                  "username": USERNAME,
                  "year": current_year
              }
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://leetcode.com/graphql",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "Mozilla/5.0",
                  "Referer": "https://leetcode.com/"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          if "errors" in data:
              raise RuntimeError(
                  json.dumps(data["errors"], indent=2)
              )

          user = data["data"]["matchedUser"]

          if not user:
              raise RuntimeError(
                  "LeetCode user not found."
              )

          # ================================================
          # SOLVED COUNTS
          # ================================================

          easy = 0
          medium = 0
          hard = 0

          for item in user["submitStats"]["acSubmissionNum"]:

              difficulty = item["difficulty"]
              count = int(item["count"])

              if difficulty == "Easy":
                  easy = count

              elif difficulty == "Medium":
                  medium = count

              elif difficulty == "Hard":
                  hard = count

          total = easy + medium + hard

          # ================================================
          # ACTIVITY CALENDAR
          # ================================================

          calendar = user["userCalendar"]

          active_days = int(
              calendar["totalActiveDays"]
          )

          submission_calendar = json.loads(
              calendar["submissionCalendar"]
          )

          daily_activity = []

          for timestamp, count in submission_calendar.items():

              local_datetime = datetime.fromtimestamp(
                  int(timestamp),
                  tz=timezone.utc
              ).astimezone(INDIA)

              daily_activity.append({
                  "date": local_datetime.date(),
                  "count": int(count)
              })

          # Merge entries belonging to the same Indian date.
          merged = {}

          for item in daily_activity:

              date = item["date"]

              merged[date] = (
                  merged.get(date, 0)
                  + item["count"]
              )

          active_dates = sorted(
              date
              for date, count in merged.items()
              if count > 0
          )

          # ================================================
          # CURRENT STREAK
          # ================================================

          current_streak = 0

          if active_dates:

              today = now.date()

              # If today has activity, start from today.
              # Otherwise start from yesterday.
              if today in active_dates:
                  check_date = today

              else:
                  check_date = today - timedelta(days=1)

              active_set = set(active_dates)

              while check_date in active_set:

                  current_streak += 1
                  check_date -= timedelta(days=1)

          # ================================================
          # BEST STREAK
          # ================================================

          best_streak = 0
          running = 0
          previous = None

          for date in active_dates:

              if (
                  previous is not None
                  and (date - previous).days == 1
              ):
                  running += 1

              else:
                  running = 1

              best_streak = max(
                  best_streak,
                  running
              )

              previous = date

          # ================================================
          # RECENT ACTIVITY
          # ================================================

          recent_activity = []

          for date in sorted(
              merged.keys(),
              reverse=True
          )[:14]:

              recent_activity.append({
                  "date": date.strftime("%Y-%m-%d"),
                  "count": merged[date]
              })

          # ================================================
          # RECENT ACCEPTED PROBLEMS
          # ================================================

          recent_submissions = (
              data["data"].get(
                  "recentAcSubmissionList"
              ) or []
          )

          # ================================================
          # SAVE DATA
          # ================================================

          output = {
              "username": USERNAME,
              "total": total,
              "easy": easy,
              "medium": medium,
              "hard": hard,
              "current_streak": current_streak,
              "best_streak": best_streak,
              "active_days": active_days,
              "recent_activity": recent_activity,
              "recent_submissions": recent_submissions,
              "updated": now.strftime(
                  "%Y-%m-%d %H:%M IST"
              )
          }

          with open(
              "leetcode-data.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  indent=2
              )

          print(
              json.dumps(
                  output,
                  indent=2
              )
          )

          PY

      - name: Update README
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("leetcode-data.json").read_text(
                  encoding="utf-8"
              )
          )

          total = data["total"]
          easy = data["easy"]
          medium = data["medium"]
          hard = data["hard"]

          current_streak = data["current_streak"]
          best_streak = data["best_streak"]
          active_days = data["active_days"]

          updated = data["updated"]

          # ================================================
          # PROGRESS BAR
          # ================================================

          def bar(value, maximum=20):

              if total == 0:
                  return "░" * maximum

              filled = round(
                  value / total * maximum
              )

              filled = max(
                  0,
                  min(
                      filled,
                      maximum
                  )
              )

              return (
                  "█" * filled
                  + "░" * (
                      maximum - filled
                  )
              )

          # ================================================
          # ACTIVITY TABLE
          # ================================================

          activity_lines = []

          for item in data["recent_activity"]:

              blocks = "█" * min(
                  item["count"],
                  10
              )

              activity_lines.append(
                  f"| {item['date']} | "
                  f"{item['count']} | "
                  f"{blocks} |"
              )

          if not activity_lines:

              activity_lines.append(
                  "| No activity yet | 0 | |"
              )

          # ================================================
          # ACCEPTED PROBLEMS
          # ================================================

          submission_lines = []

          for item in data["recent_submissions"]:

              title = item["title"]
              slug = item["titleSlug"]

              submission_lines.append(
                  f"- 🧩 [{title}]"
                  f"(https://leetcode.com/problems/{slug}/)"
              )

          if not submission_lines:

              submission_lines.append(
                  "- No recent accepted submissions found."
              )

          # ================================================
          # DASHBOARD
          # ================================================

          dashboard = f"""<!-- LEETCODE-DASHBOARD:START -->

          ## 🏆 Live LeetCode Dashboard

          > 🔄 **Automatically synced from LeetCode**

          | 📊 Metric | 🔥 Progress |
          | :--- | ---: |
          | **Total Solved** | **{total}** |
          | 🟢 Easy | **{easy}** |
          | 🟡 Medium | **{medium}** |
          | 🔴 Hard | **{hard}** |
          | 🔥 Current Streak | **{current_streak} days** |
          | 🏆 Best Streak | **{best_streak} days** |
          | 📅 Active Days | **{active_days}** |

          ### 📈 Difficulty Distribution

          ```text
          🟢 Easy      {bar(easy)}  {easy}
          🟡 Medium    {bar(medium)}  {medium}
          🔴 Hard      {bar(hard)}  {hard}

                       TOTAL → {total}
          ```

          ### 📅 Recent Coding Activity

          | Date | Problems | Activity |
          | :--- | ---: | :--- |
          {chr(10).join(activity_lines)}

          ### 🧩 Latest Accepted Problems

          {chr(10).join(submission_lines)}

          ### 🔥 Consistency

          ```text
          Current Streak : {current_streak} days
          Best Streak    : {best_streak} days
          Active Days    : {active_days}
          ```

          > 🕐 Last synchronized: **{updated}**

          <!-- LEETCODE-DASHBOARD:END -->"""

          # ================================================
          # UPDATE README
          # ================================================

          readme = Path("README.md")

          text = readme.read_text(
              encoding="utf-8"
          )

          start = (
              "<!-- LEETCODE-DASHBOARD:START -->"
          )

          end = (
              "<!-- LEETCODE-DASHBOARD:END -->"
          )

          if start not in text or end not in text:

              raise SystemExit(
                  "Dashboard markers not found in README.md"
              )

          before = text.split(
              start,
              1
          )[0]

          after = text.split(
              end,
              1
          )[1]

          text = (
              before
              + dashboard
              + after
          )

          readme.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "README dashboard updated successfully."
          )

          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes detected."
          else
            git commit -m "Update LeetCode dashboard"
            git push
          fi
