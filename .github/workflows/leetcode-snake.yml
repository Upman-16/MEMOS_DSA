`- name: Generate animated snake
  run: |
    mkdir -p assets

    python3 <<'PY'
    import json
    import html
    from datetime import datetime, timedelta, timezone

    with open("leetcode-calendar.json", encoding="utf-8") as f:
        calendar = json.load(f)

    CELL = 13
    GAP = 3
    LEFT = 45
    TOP = 30
    WEEKS = 53

    WIDTH = LEFT + WEEKS * (CELL + GAP) + 10
    HEIGHT = TOP + 7 * (CELL + GAP) + 35

    today = datetime.now(timezone.utc).date()
    start = today - timedelta(days=364)

    while start.weekday() != 6:
        start -= timedelta(days=1)

    values = [int(v) for v in calendar.values()]
    maximum = max(values) if values else 1

    colors = {
        0: "#161b22",
        1: "#0e4429",
        2: "#006d32",
        3: "#26a641",
        4: "#39d353"
    }

    def level(value):
        if value <= 0:
            return 0

        ratio = value / maximum

        if ratio <= 0.25:
            return 1
        if ratio <= 0.50:
            return 2
        if ratio <= 0.75:
            return 3

        return 4

    # --------------------------------------------------
    # HEATMAP CELLS
    # --------------------------------------------------

    cells = []

    for week in range(WEEKS):
        for day in range(7):

            date = start + timedelta(
                days=week * 7 + day
            )

            timestamp = int(
                datetime(
                    date.year,
                    date.month,
                    date.day,
                    tzinfo=timezone.utc
                ).timestamp()
            )

            value = int(
                calendar.get(str(timestamp), 0)
            )

            x = LEFT + week * (CELL + GAP)
            y = TOP + day * (CELL + GAP)

            cells.append({
                "week": week,
                "day": day,
                "x": x,
                "y": y,
                "value": value,
                "date": str(date)
            })

    # --------------------------------------------------
    # SNAKE ROUTE
    #
    # The route runs through the gaps between cells.
    # It is invisible; only the animated snake is shown.
    # --------------------------------------------------

    points = []

    for week in range(WEEKS):

        x = LEFT + week * (CELL + GAP) + CELL / 2

        if week % 2 == 0:
            days = range(7)
        else:
            days = range(6, -1, -1)

        for day in days:

            y = TOP + day * (CELL + GAP) - GAP / 2

            points.append((x, y))

    # --------------------------------------------------
    # BUILD SMOOTH SVG PATH
    # --------------------------------------------------

    path = []

    if points:
        path.append(f"M {points[0][0]},{points[0][1]}")

    for i in range(1, len(points)):

        x0, y0 = points[i - 1]
        x1, y1 = points[i]

        # Rounded corner control points.
        dx = x1 - x0
        dy = y1 - y0

        if abs(dx) > abs(dy):
            cx1 = x0 + dx * 0.55
            cy1 = y0
            cx2 = x1 - dx * 0.55
            cy2 = y1
        else:
            cx1 = x0
            cy1 = y0 + dy * 0.55
            cx2 = x1
            cy2 = y1 - dy * 0.55

        path.append(
            f"C {cx1},{cy1} {cx2},{cy2} {x1},{y1}"
        )

    path_data = " ".join(path)

    # --------------------------------------------------
    # SVG
    # --------------------------------------------------

    svg = []

    svg.append(
        f'<svg xmlns="http://www.w3.org/2000/svg" '
        f'width="{WIDTH}" height="{HEIGHT}" '
        f'viewBox="0 0 {WIDTH} {HEIGHT}">'
    )

    svg.append(
        '<rect width="100%" height="100%" '
        'rx="10" fill="#0d1117"/>'
    )

    svg.append(
        '<text x="12" y="18" '
        'font-family="Arial" '
        'font-size="12" '
        'fill="#8b949e">'
        'LeetCode Activity • 🐍'
        '</text>'
    )

    # --------------------------------------------------
    # HEATMAP
    # --------------------------------------------------

    for cell in cells:

        fill = colors[level(cell["value"])]

        title = html.escape(
            f"{cell['date']}: "
            f"{cell['value']} submissions"
        )

        svg.append(
            f'<rect '
            f'x="{cell["x"]}" '
            f'y="{cell["y"]}" '
            f'width="{CELL}" '
            f'height="{CELL}" '
            f'rx="2" '
            f'fill="{fill}">'
            f'<title>{title}</title>'
            f'</rect>'
        )

    # --------------------------------------------------
    # DEFINITIONS
    # --------------------------------------------------

    svg.append("<defs>")

    # Glow around the snake.
    svg.append(
        '<filter id="snakeGlow" '
        'x="-100%" y="-100%" '
        'width="300%" height="300%">'
        '<feGaussianBlur stdDeviation="3" '
        'result="blur"/>'
        '<feMerge>'
        '<feMergeNode in="blur"/>'
        '<feMergeNode in="SourceGraphic"/>'
        '</feMerge>'
        '</filter>'
    )

    # Motion path.
    svg.append(
        f'<path id="snakePath" '
        f'd="{path_data}" '
        f'fill="none" '
        f'stroke="none"/>'
    )

    svg.append("</defs>")

    # --------------------------------------------------
    # SNAKE BODY
    #
    # One long stroke.
    # Its dash pattern reveals only a moving section.
    # The dash offset follows the same motion path as the head.
    # --------------------------------------------------

    snake_body = (
        f'<path '
        f'd="{path_data}" '
        f'fill="none" '
        f'stroke="#ff7b72" '
        f'stroke-width="6" '
        f'stroke-linecap="round" '
        f'stroke-linejoin="round" '
        f'stroke-dasharray="55 99999" '
        f'filter="url(#snakeGlow)" '
        f'opacity="0.95">'
        f'<animate '
        f'attributeName="stroke-dashoffset" '
        f'from="0" '
        f'to="-9999" '
        f'dur="22s" '
        f'repeatCount="indefinite"/>'
        f'</path>'
    )

    svg.append(snake_body)

    # --------------------------------------------------
    # SINGLE HEAD
    # --------------------------------------------------

    svg.append(
        '<g>'
        '<circle '
        'cx="0" cy="0" r="5.5" '
        'fill="#ff7b72" '
        'stroke="#ffffff" '
        'stroke-width="1.5"/>'

        # Left eye
        '<circle '
        'cx="-1.8" cy="-2" r="1.15" '
        'fill="#ffffff"/>'

        # Right eye
        '<circle '
        'cx="1.8" cy="-2" r="1.15" '
        'fill="#ffffff"/>'

        # Pupils
        '<circle '
        'cx="-1.8" cy="-2" r="0.45" '
        'fill="#0d1117"/>'

        '<circle '
        'cx="1.8" cy="-2" r="0.45" '
        'fill="#0d1117"/>'

        '<animateMotion '
        'dur="22s" '
        'repeatCount="indefinite" '
        'rotate="auto">'
        '<mpath href="#snakePath"/>'
        '</animateMotion>'

        '</g>'
    )

    # --------------------------------------------------
    # SMALL HIGHLIGHT
    # --------------------------------------------------

    svg.append(
        '<circle '
        'cx="0" cy="-1.8" r="1" '
        'fill="#ffffff" '
        'opacity="0.45">'
        '<animateMotion '
        'dur="22s" '
        'repeatCount="indefinite" '
        'rotate="auto">'
        '<mpath href="#snakePath"/>'
        '</animateMotion>'
        '</circle>'
    )

    # --------------------------------------------------
    # LEGEND
    # --------------------------------------------------

    svg.append(
        f'<text x="{LEFT}" '
        f'y="{HEIGHT - 8}" '
        f'font-family="Arial" '
        f'font-size="8" '
        f'fill="#8b949e">'
        'LeetCode activity'
        '</text>'
    )

    svg.append("</svg>")

    with open(
        "assets/leetcode-snake.svg",
        "w",
        encoding="utf-8"
    ) as file:
        file.write("\\n".join(svg))

    print("Single smooth LeetCode snake generated.")

    PY`
