name: Generate LeetCode Snake

on:
  schedule:
    - cron: "45 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pillow

      - name: Fetch LeetCode activity
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          username = "Danger_exe_fr"
          year = datetime.now(timezone.utc).year

          query = """
          query userCalendar($username: String!, $year: Int) {
            matchedUser(username: $username) {
              userCalendar(year: $year) {
                submissionCalendar
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "username": username,
                  "year": year
              }
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://leetcode.com/graphql",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "Mozilla/5.0",
                  "Referer": "https://leetcode.com/"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.loads(response.read().decode("utf-8"))

          if "errors" in data:
              raise RuntimeError(
                  json.dumps(data["errors"], indent=2)
              )

          user = data["data"]["matchedUser"]

          if not user:
              raise RuntimeError("LeetCode user not found.")

          calendar = json.loads(
              user["userCalendar"]["submissionCalendar"]
          )

          with open(
              "leetcode-calendar.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(calendar, f)

          print(
              f"Loaded {len(calendar)} activity entries."
          )
          PY

      - name: Generate animated LeetCode snake GIF
        run: |
          mkdir -p assets

          python3 <<'PY'
          import json
          import math
          from datetime import datetime, timedelta
          from PIL import Image, ImageDraw

          # --------------------------------------------------
          # Configuration
          # --------------------------------------------------

          CELL = 13
          GAP = 3

          LEFT = 45
          TOP = 32

          WEEKS = 53
          DAYS = 7

          WIDTH = LEFT + WEEKS * (CELL + GAP) + 15
          HEIGHT = TOP + DAYS * (CELL + GAP) + 38

          BG = (13, 17, 23)

          GREEN = {
              0: (22, 27, 34),
              1: (14, 68, 41),
              2: (0, 109, 50),
              3: (38, 166, 65),
              4: (57, 211, 83)
          }

          SNAKE_HEAD = (255, 123, 114)
          SNAKE_BODY = (255, 123, 114)
          SNAKE_EYE = (13, 17, 23)

          # --------------------------------------------------
          # Load calendar
          # --------------------------------------------------

          with open(
              "leetcode-calendar.json",
              encoding="utf-8"
          ) as f:
              calendar = json.load(f)

          values = [
              int(v)
              for v in calendar.values()
          ]

          maximum = max(values) if values else 1

          def level(value):
              if value <= 0:
                  return 0

              ratio = value / maximum

              if ratio <= 0.25:
                  return 1
              elif ratio <= 0.50:
                  return 2
              elif ratio <= 0.75:
                  return 3
              else:
                  return 4

          # --------------------------------------------------
          # Date range
          # --------------------------------------------------

          today = datetime.utcnow().date()

          start = today - timedelta(days=364)

          while start.weekday() != 6:
              start -= timedelta(days=1)

          # --------------------------------------------------
          # Heatmap cells
          # --------------------------------------------------

          cells = []

          for week in range(WEEKS):

              for day in range(DAYS):

                  date = start + timedelta(
                      days=week * 7 + day
                  )

                  timestamp = int(
                      datetime(
                          date.year,
                          date.month,
                          date.day
                      ).timestamp()
                  )

                  value = int(
                      calendar.get(
                          str(timestamp),
                          0
                      )
                  )

                  x = LEFT + week * (CELL + GAP)
                  y = TOP + day * (CELL + GAP)

                  cells.append(
                      (x, y, value)
                  )

          # --------------------------------------------------
          # Snake path
          #
          # The snake travels through the vertical gaps
          # between heatmap columns.
          # --------------------------------------------------

          path = []

          for week in range(WEEKS + 1):

              x = LEFT - GAP / 2 + week * (CELL + GAP)

              if week % 2 == 0:

                  for i in range(80):

                      y = (
                          TOP - GAP / 2
                          +
                          i / 79
                          * (
                              DAYS * (CELL + GAP)
                              - GAP
                          )
                      )

                      path.append((x, y))

              else:

                  for i in range(80):

                      y = (
                          TOP
                          + DAYS * (CELL + GAP)
                          - GAP / 2
                          -
                          i / 79
                          * (
                              DAYS * (CELL + GAP)
                              - GAP
                          )
                      )

                      path.append((x, y))

          # --------------------------------------------------
          # Interpolate path so animation is smooth
          # --------------------------------------------------

          smooth_path = []

          for i in range(len(path) - 1):

              x1, y1 = path[i]
              x2, y2 = path[i + 1]

              distance = math.hypot(
                  x2 - x1,
                  y2 - y1
              )

              steps = max(
                  1,
                  int(distance / 2)
              )

              for j in range(steps):

                  t = j / steps

                  smooth_path.append(
                      (
                          x1 + (x2 - x1) * t,
                          y1 + (y2 - y1) * t
                      )
                  )

          smooth_path.append(path[-1])

          # --------------------------------------------------
          # Draw frame
          # --------------------------------------------------

          def draw_frame(frame):

              image = Image.new(
                  "RGB",
                  (WIDTH, HEIGHT),
                  BG
              )

              draw = ImageDraw.Draw(image)

              # Title
              draw.text(
                  (12, 10),
                  "LeetCode Activity",
                  fill=(139, 148, 158)
              )

              # Heatmap
              for x, y, value in cells:

                  draw.rounded_rectangle(
                      [
                          x,
                          y,
                          x + CELL,
                          y + CELL
                      ],
                      radius=2,
                      fill=GREEN[level(value)]
                  )

              # ------------------------------------------------
              # Snake
              # ------------------------------------------------

              head_index = (
                  frame * 7
              ) % len(smooth_path)

              body_length = 18

              body_points = []

              for i in range(body_length):

                  index = (
                      head_index - i * 3
                  ) % len(smooth_path)

                  body_points.append(
                      smooth_path[index]
                  )

              # Draw body
              for i in range(
                  len(body_points) - 1,
                  -1,
                  -1
              ):

                  x, y = body_points[i]

                  radius = max(
                      2.0,
                      5.0 - i * 0.15
                  )

                  draw.ellipse(
                      [
                          x - radius,
                          y - radius,
                          x + radius,
                          y + radius
                      ],
                      fill=SNAKE_BODY
                  )

              # Draw head
              hx, hy = body_points[0]

              head_radius = 6

              draw.ellipse(
                  [
                      hx - head_radius,
                      hy - head_radius,
                      hx + head_radius,
                      hy + head_radius
                  ],
                  fill=SNAKE_HEAD
              )

              # Eyes
              draw.ellipse(
                  [
                      hx - 3,
                      hy - 2,
                      hx - 1,
                      hy
                  ],
                  fill=SNAKE_EYE
              )

              draw.ellipse(
                  [
                      hx + 1,
                      hy - 2,
                      hx + 3,
                      hy
                  ],
                  fill=SNAKE_EYE
              )

              # Legend
              draw.text(
                  (LEFT, HEIGHT - 17),
                  "Less",
                  fill=(139, 148, 158)
              )

              for i in range(5):

                  x = (
                      LEFT
                      + 28
                      + i * (CELL + GAP)
                  )

                  draw.rounded_rectangle(
                      [
                          x,
                          HEIGHT - 20,
                          x + CELL,
                          HEIGHT - 7
                      ],
                      radius=2,
                      fill=GREEN[i]
                  )

              draw.text(
                  (
                      LEFT
                      + 28
                      + 5 * (CELL + GAP)
                      + 3,
                      HEIGHT - 17
                  ),
                  "More",
                  fill=(139, 148, 158)
              )

              return image

          # --------------------------------------------------
          # Generate frames
          # --------------------------------------------------

          frames = []

          FRAME_COUNT = 80

          for frame_number in range(FRAME_COUNT):

              print(
                  f"Generating frame "
                  f"{frame_number + 1}/{FRAME_COUNT}"
              )

              frames.append(
                  draw_frame(frame_number)
              )

          # --------------------------------------------------
          # Save GIF
          # --------------------------------------------------

          output = (
              "assets/leetcode-snake.gif"
          )

          frames[0].save(
              output,
              save_all=True,
              append_images=frames[1:],
              duration=100,
              loop=0,
              optimize=False
          )

          print(
              f"Created {output}"
          )
          PY

      - name: Remove old SVG
        run: |
          rm -f assets/leetcode-snake.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/leetcode-snake.gif
          git add -u assets/leetcode-snake.svg

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Add animated LeetCode snake GIF"
            git push
          fi
