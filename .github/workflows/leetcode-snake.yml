name: Generate LeetCode Snake

on:
  schedule:
    - cron: "45 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch LeetCode activity
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          username = "Danger_exe_fr"
          year = datetime.now(timezone.utc).year

          query = """
          query userCalendar($username: String!, $year: Int) {
            matchedUser(username: $username) {
              userCalendar(year: $year) {
                submissionCalendar
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "username": username,
                  "year": year
              }
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://leetcode.com/graphql",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "Mozilla/5.0",
                  "Referer": "https://leetcode.com/"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.loads(response.read().decode())

          if "errors" in data:
              raise RuntimeError(
                  json.dumps(data["errors"], indent=2)
              )

          user = data["data"]["matchedUser"]

          if not user:
              raise RuntimeError("LeetCode user not found.")

          calendar = json.loads(
              user["userCalendar"]["submissionCalendar"]
          )

          with open(
              "leetcode-calendar.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(calendar, file)

          print(
              f"Loaded {len(calendar)} LeetCode activity entries."
          )
          PY

      - name: Generate heatmap and single snake
        run: |
          mkdir -p assets

          python3 <<'PY'
          import json
          import html
          from datetime import datetime, timedelta

          calendar = json.load(
              open(
                  "leetcode-calendar.json",
                  encoding="utf-8"
              )
          )

          # --------------------------------------------------
          # Layout
          # --------------------------------------------------

          CELL = 13
          GAP = 3

          LEFT = 45
          TOP = 32

          WEEKS = 53

          WIDTH = LEFT + WEEKS * (CELL + GAP) + 15
          HEIGHT = TOP + 7 * (CELL + GAP) + 38

          today = datetime.utcnow().date()

          start = today - timedelta(days=364)

          while start.weekday() != 6:
              start -= timedelta(days=1)

          # --------------------------------------------------
          # Activity levels
          # --------------------------------------------------

          values = [
              int(v)
              for v in calendar.values()
          ]

          maximum = max(values) if values else 1

          colors = {
              0: "#161b22",
              1: "#0e4429",
              2: "#006d32",
              3: "#26a641",
              4: "#39d353"
          }

          def get_level(value):

              if value <= 0:
                  return 0

              ratio = value / maximum

              if ratio <= 0.25:
                  return 1

              if ratio <= 0.50:
                  return 2

              if ratio <= 0.75:
                  return 3

              return 4

          # --------------------------------------------------
          # Build cells
          # --------------------------------------------------

          cells = []

          for week in range(WEEKS):

              for day in range(7):

                  date = start + timedelta(
                      days=week * 7 + day
                  )

                  timestamp = int(
                      datetime(
                          date.year,
                          date.month,
                          date.day
                      ).timestamp()
                  )

                  value = int(
                      calendar.get(
                          str(timestamp),
                          0
                      )
                  )

                  x = LEFT + week * (CELL + GAP)
                  y = TOP + day * (CELL + GAP)

                  cells.append({
                      "week": week,
                      "day": day,
                      "x": x,
                      "y": y,
                      "date": date,
                      "value": value
                  })

          # --------------------------------------------------
          # Snake path
          #
          # The snake moves through the GAPS:
          #
          #       ───────────────
          #  🟩 🟩 🟩 🟩 🟩 🟩
          #       │
          #       ───────────────
          #  🟩 🟩 🟩 🟩 🟩 🟩
          #
          # It never travels through the center
          # of a contribution square.
          # --------------------------------------------------

          snake_points = []

          corridor_x = LEFT - (GAP / 2)

          for week in range(WEEKS):

              x = LEFT + week * (CELL + GAP) - GAP / 2

              if week % 2 == 0:

                  # Vertical corridor: top -> bottom
                  snake_points.append(
                      (x, TOP - GAP / 2)
                  )

                  snake_points.append(
                      (
                          x,
                          TOP
                          + 7 * (CELL + GAP)
                          - GAP / 2
                      )
                  )

              else:

                  # Vertical corridor: bottom -> top
                  snake_points.append(
                      (
                          x,
                          TOP
                          + 7 * (CELL + GAP)
                          - GAP / 2
                      )
                  )

                  snake_points.append(
                      (x, TOP - GAP / 2)
                  )

          path_data = (
              "M "
              +
              " L ".join(
                  f"{x:.1f},{y:.1f}"
                  for x, y in snake_points
              )
          )

          # --------------------------------------------------
          # SVG
          # --------------------------------------------------

          svg = []

          svg.append(
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{WIDTH}" '
              f'height="{HEIGHT}" '
              f'viewBox="0 0 {WIDTH} {HEIGHT}">'
          )

          svg.append(
              '<rect width="100%" '
              'height="100%" '
              'rx="10" '
              'fill="#0d1117"/>'
          )

          svg.append(
              '<text x="12" y="19" '
              'font-family="Arial, sans-serif" '
              'font-size="12" '
              'font-weight="bold" '
              'fill="#8b949e">'
              'LeetCode Activity • 🐍'
              '</text>'
          )

          # --------------------------------------------------
          # Heatmap cells
          # --------------------------------------------------

          for cell in cells:

              fill = colors[
                  get_level(cell["value"])
              ]

              title = html.escape(
                  f"{cell['date']}: "
                  f"{cell['value']} submissions"
              )

              svg.append(
                  f'<rect '
                  f'x="{cell["x"]}" '
                  f'y="{cell["y"]}" '
                  f'width="{CELL}" '
                  f'height="{CELL}" '
                  f'rx="2" '
                  f'fill="{fill}">'
                  f'<title>{title}</title>'
                  f'</rect>'
              )

          # --------------------------------------------------
          # SINGLE SNAKE
          # --------------------------------------------------

          svg.append(
              f'<path '
              f'd="{path_data}" '
              f'fill="none" '
              f'stroke="#ff7b72" '
              f'stroke-width="4" '
              f'stroke-linecap="round" '
              f'stroke-linejoin="round" '
              f'stroke-dasharray="42 1800">'
              f'<animate '
              f'attributeName="stroke-dashoffset" '
              f'from="0" '
              f'to="-1842" '
              f'dur="18s" '
              f'repeatCount="indefinite"/>'
              f'</path>'
          )

          # --------------------------------------------------
          # Day labels
          # --------------------------------------------------

          labels = {
              1: "Mon",
              3: "Wed",
              5: "Fri"
          }

          for row, label in labels.items():

              y = TOP + row * (CELL + GAP) + 10

              svg.append(
                  f'<text x="5" y="{y}" '
                  f'font-family="Arial, sans-serif" '
                  f'font-size="8" '
                  f'fill="#8b949e">'
                  f'{label}'
                  f'</text>'
              )

          # --------------------------------------------------
          # Legend
          # --------------------------------------------------

          legend_y = HEIGHT - 10

          svg.append(
              f'<text x="{LEFT}" y="{legend_y}" '
              f'font-family="Arial, sans-serif" '
              f'font-size="8" '
              f'fill="#8b949e">'
              f'Less'
              f'</text>'
          )

          for i in range(5):

              x = LEFT + 25 + i * (CELL + GAP)

              svg.append(
                  f'<rect x="{x}" '
                  f'y="{HEIGHT - 18}" '
                  f'width="{CELL}" '
                  f'height="{CELL}" '
                  f'rx="2" '
                  f'fill="{colors[i]}"/>'
              )

          svg.append(
              f'<text '
              f'x="{LEFT + 25 + 5 * (CELL + GAP)}" '
              f'y="{legend_y}" '
              f'font-family="Arial, sans-serif" '
              f'font-size="8" '
              f'fill="#8b949e">'
              f'More'
              f'</text>'
          )

          svg.append("</svg>")

          with open(
              "assets/leetcode-snake.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(
                  "\n".join(svg)
              )

          print(
              "Single gap-traveling LeetCode snake generated."
          )
          PY

      - name: Commit snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/leetcode-snake.svg

          if git diff --cached --quiet; then
            echo "No snake changes detected."
          else
            git commit -m "Fix LeetCode snake path"
            git push
          fi
